<div class="forgot-wrapper">

  <!-- Floating Decorative Shapes -->
  <div class="floating-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="card">

    <!-- Branding -->
    <div class="brand-header">
      <div class="brand-icon">🔐</div>
      <h1>Reset Password</h1>
      <p>Provide your details to reset your password</p>
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="resetPassword()">

      <div class="input-group-custom">
        <label class="form-label">Email Address</label>
        <div class="input-icon-wrap">
          <span class="input-icon">📧</span>
          <input formControlName="email" type="email" class="form-control" placeholder="you@example.com">
        </div>
      </div>

      <div class="input-group-custom">
        <label class="form-label">Mobile Number</label>
        <div class="input-icon-wrap">
          <span class="input-icon">📱</span>
          <input formControlName="mobile" type="text" class="form-control" placeholder="10-digit mobile number">
        </div>
      </div>

      <div class="input-group-custom">
        <label class="form-label">New Password</label>
        <div class="input-icon-wrap">
          <span class="input-icon">🔒</span>
          <input formControlName="newPassword" type="password" class="form-control" placeholder="New strong password">
        </div>
      </div>

      <button type="submit" id="resetBtn" class="btn-submit">Reset Password</button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">← Back to Login</a>
    </div>

  </div>
</div>
