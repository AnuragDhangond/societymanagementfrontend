<div 
  class="sidebar"
  [class.open]="isOpen"
  *ngIf="isLoggedIn"
>

  <div class="sidebar-header">
    <div class="sidebar-brand-icon">🏠</div>
    <span class="sidebar-brand-text">Sai Balaji</span>
  </div>

  <ul class="menu">
    <li routerLink="/members" routerLinkActive="active">
      <span class="menu-icon">👥</span>
      <span class="menu-text">Members</span>
    </li>
    <li routerLink="/maintenance" routerLinkActive="active">
      <span class="menu-icon">🔧</span>
      <span class="menu-text">Maintenance</span>
    </li>
    <li routerLink="/complaints" routerLinkActive="active">
      <span class="menu-icon">📋</span>
      <span class="menu-text">Complaints</span>
    </li>
    <li routerLink="/expenses" routerLinkActive="active">
      <span class="menu-icon">💰</span>
      <span class="menu-text">Expenses</span>
    </li>
    <li routerLink="/notice" routerLinkActive="active">
      <span class="menu-icon">📢</span>
      <span class="menu-text">Notices</span>
    </li>
    <li *ngIf="userRole === 'admin'" routerLink="/accounts" routerLinkActive="active">
      <span class="menu-icon">📊</span>
      <span class="menu-text">Accounts</span>
    </li>
    <li routerLink="/election" routerLinkActive="active">
      <span class="menu-icon">🗳️</span>
      <span class="menu-text">Election</span>
    </li>

    <li class="logout" (click)="logout()">
      <span class="menu-icon">🚪</span>
      <span class="menu-text">Logout</span>
    </li>
  </ul>

</div>
