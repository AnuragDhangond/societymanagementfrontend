<div class="signup-wrapper">

  <!-- Floating Decorative Shapes -->
  <div class="floating-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="card">

    <!-- Branding -->
    <div class="brand-header">
      <div class="brand-icon">🏠</div>
      <h1>Sai Balaji Society</h1>
      <p>Create your account</p>
    </div>

    <form [formGroup]="signupForm" (ngSubmit)="signUp()">

      <!-- Role Dropdown -->
      <div class="input-group-custom">
        <label class="form-label">Select Role</label>
        <div class="input-icon-wrap">
          <span class="input-icon">👤</span>
          <select class="form-control" formControlName="role" id="signupRole">
            <option value="">-- Select Role --</option>
            <option value="admin">Admin</option>
            <option value="member">Member</option>
          </select>
        </div>
      </div>

      <!-- Admin Code (Only for Admin) -->
      <div class="input-group-custom" *ngIf="signupForm.get('role')?.value === 'admin'">
        <label class="form-label">
          Admin Signup Code
          <small class="text-muted-light">(Provided by Administrator)</small>
        </label>
        <div class="input-icon-wrap">
          <span class="input-icon">🔑</span>
          <input formControlName="adminCode"
                 type="password"
                 class="form-control"
                 placeholder="Enter 4-digit admin code">
        </div>
      </div>

      <!-- ===== FLAT + WING (Only for Member) ===== -->
      <div *ngIf="signupForm.get('role')?.value === 'member'" class="flat-wing-row">
        <div class="input-group-custom flat-input">
          <label class="form-label">Flat Number</label>
          <div class="input-icon-wrap">
            <span class="input-icon">🏢</span>
            <input formControlName="flat"
                   type="text"
                   class="form-control"
                   placeholder="e.g. 101"
                   maxlength="3"
                   pattern="[0-9]{3}">
          </div>
        </div>

        <div class="input-group-custom wing-input">
          <label class="form-label">Wing</label>
          <div class="input-icon-wrap">
            <span class="input-icon">🅰️</span>
            <select class="form-control" formControlName="wing">
              <option value="">Select</option>
              <option value="Wing A">Wing A</option>
              <option value="Wing B">Wing B</option>
            </select>
          </div>
        </div>
      </div>

      <div class="input-group-custom">
        <label class="form-label">Email Address</label>
        <div class="input-icon-wrap">
          <span class="input-icon">📧</span>
          <input formControlName="email" type="email" class="form-control" placeholder="you@example.com">
        </div>
      </div>

      <div class="input-group-custom">
        <label class="form-label">Full Name</label>
        <div class="input-icon-wrap">
          <span class="input-icon">✏️</span>
          <input formControlName="name" type="text" class="form-control" placeholder="Full Name">
        </div>
      </div>

      <div class="input-group-custom">
        <label class="form-label">Phone Number</label>
        <div class="input-icon-wrap">
          <span class="input-icon">📱</span>
          <input formControlName="mobile" type="number" class="form-control" placeholder="10-digit number">
        </div>
      </div>

      <div class="input-group-custom">
        <label class="form-label">Password</label>
        <div class="input-icon-wrap">
          <span class="input-icon">🔒</span>
          <input formControlName="password" type="password" class="form-control" placeholder="Min 6 characters">
        </div>
      </div>

      <button type="submit" id="signupBtn" class="btn-submit">Sign Up</button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">Already a user? Click to Login</a>
    </div>

  </div>

</div>
